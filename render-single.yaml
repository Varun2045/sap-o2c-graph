services:
  # Single service serving both backend API and frontend
  - type: web
    name: sap-o2c-graph
    runtime: python
    plan: free
    buildCommand: cd backend; pip install -r requirements.txt; cd ../frontend; npm install; npm run build
    startCommand: cd backend; python main.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /health
